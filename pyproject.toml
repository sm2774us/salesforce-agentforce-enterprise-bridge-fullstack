[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salesforce-agentforce-enterprise-bridge"
version = "1.0.1"
description = "Governed bridge between enterprise telemetry, Salesforce Data Cloud-style grounding and Agentforce Actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "pip-audit>=2.7"]

[project.scripts]
bridge = "bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live' --cov=bridge --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["live: hits a real Salesforce org (needs SF_* secrets)"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "SIM"]
ignore = ["D203", "D213", "UP042", "B008", "D107", "D102", "D105", "D101", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501", "E731", "I001", "SIM"]
