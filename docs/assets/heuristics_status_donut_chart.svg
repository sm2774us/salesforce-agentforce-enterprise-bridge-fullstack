<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <style>
    text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; fill: #222; }
    .title { font-size: 15px; font-weight: bold; text-anchor: middle; }
    .legend-text { font-size: 12px; }
  </style>
  
  <text x="160" y="25" class="title">20 AI Engineering Heuristics</text>
  
  <!-- Donut slices (approximate proportional segments for 2, 5, 8, 5) -->
  <circle cx="160" cy="160" r="75" fill="none" stroke="#e0e0e0" stroke-width="35" />
  
  <!-- Implemented (2/20 = 10% -> stroke-dasharray) -->
  <circle cx="160" cy="160" r="75" fill="none" stroke="#28a745" stroke-width="35"
          stroke-dasharray="47.1 424.1" stroke-dashoffset="0" />
  <!-- Partial (5/20 = 25%) -->
  <circle cx="160" cy="160" r="75" fill="none" stroke="#ffc107" stroke-width="35"
          stroke-dasharray="117.8 353.4" stroke-dashoffset="-47.1" />
  <!-- Roadmap Seam (8/20 = 40%) -->
  <circle cx="160" cy="160" r="75" fill="none" stroke="#17a2b8" stroke-width="35"
          stroke-dasharray="169.6 301.6" stroke-dashoffset="-164.9" />
  <!-- N/A Hosted (5/20 = 25%) -->
  <circle cx="160" cy="160" r="75" fill="none" stroke="#6c757d" stroke-width="35"
          stroke-dasharray="117.8 353.4" stroke-dashoffset="-334.5" />

  <!-- Legend -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="10" height="10" fill="#28a745" />
    <text x="15" y="10" class="legend-text">Implemented (2)</text>
    <rect x="130" y="0" width="10" height="10" fill="#ffc107" />
    <text x="145" y="10" class="legend-text">Partial (5)</text>
    <rect x="0" y="18" width="10" height="10" fill="#17a2b8" />
    <text x="15" y="28" class="legend-text">Roadmap (8)</text>
    <rect x="130" y="18" width="10" height="10" fill="#6c757d" />
    <text x="145" y="28" class="legend-text">N/A Hosted (5)</text>
  </g>
</svg>