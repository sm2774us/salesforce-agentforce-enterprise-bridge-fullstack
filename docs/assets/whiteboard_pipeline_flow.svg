<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <style>
    text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; fill: #222; }
    .box { fill: #fcfcfc; stroke: #333; stroke-width: 2.5; stroke-dasharray: 4,2; rx: 8; ry: 8; }
    .arrow { stroke: #333; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    .label { font-size: 16px; font-weight: bold; text-anchor: middle; }
    .sublabel { font-size: 12px; fill: #555; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <rect x="20" y="40" width="100" height="70" class="box" />
  <text x="70" y="75" class="label">Event</text>
  <text x="70" y="95" class="sublabel">Signal In</text>

  <rect x="150" y="40" width="100" height="70" class="box" />
  <text x="200" y="75" class="label">Ground</text>
  <text x="200" y="95" class="sublabel">Context</text>

  <rect x="280" y="40" width="100" height="70" class="box" />
  <text x="330" y="75" class="label">Plan</text>
  <text x="330" y="95" class="sublabel">Rules / LLM</text>

  <rect x="410" y="40" width="100" height="70" class="box" />
  <text x="460" y="75" class="label">Govern</text>
  <text x="460" y="95" class="sublabel">Control Tower</text>

  <rect x="540" y="40" width="100" height="70" class="box" />
  <text x="590" y="75" class="label">Action</text>
  <text x="590" y="95" class="sublabel">REST / Case</text>

  <rect x="670" y="40" width="100" height="70" class="box" />
  <text x="720" y="75" class="label">Audit</text>
  <text x="720" y="95" class="sublabel">Evidence</text>

  <path d="M 120 75 L 145 75" class="arrow" />
  <path d="M 250 75 L 275 75" class="arrow" />
  <path d="M 380 75 L 405 75" class="arrow" />
  <path d="M 510 75 L 535 75" class="arrow" />
  <path d="M 640 75 L 665 75" class="arrow" />
</svg>